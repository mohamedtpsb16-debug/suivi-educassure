<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Suivi Educ'Assure</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi EA">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0C7C90;--teal-d:#0A5F6E;--teal-50:#EEF7F8;--teal-100:#D9EEF1;--or:#EE8434;--or-50:#FEF3E9;--vio:#6C5CC4;--vio-50:#F1EFFB;--red:#D9534F;--red-50:#FDEEEE;--green:#1E9E5A;--green-50:#EAF7F0;--wa:#1FAF5A;--ink:#18343B;--mut:#71858A;--line:#E8EFF0;--bg:#F5F8F8;--card:#FFFFFF}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.4}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--ink)}
button{cursor:pointer}
.hide{display:none!important}
h1,h2,h3,.ttl{font-family:Poppins,Inter,sans-serif;font-weight:600;margin:0}
a{color:inherit;text-decoration:none}

/* Connexion */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(180deg,#FFFFFF 0%,var(--teal-50) 100%)}
.lcard{width:100%;max-width:360px;text-align:center}
.lcard img{width:170px}
.lcard h2{margin:22px 0 6px;font-size:21px}
.lcard p{margin:0 0 22px;color:var(--mut);font-size:14px}
.pin{width:100%;font-size:28px;letter-spacing:14px;text-align:center;font-weight:600;border:1.5px solid var(--line);border-radius:16px;padding:14px 8px;background:#fff;outline:none}
.pin:focus{border-color:var(--teal);box-shadow:0 0 0 4px var(--teal-100)}
.btn-main{width:100%;margin-top:14px;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:600;color:#fff;background:var(--teal)}
.lerr{color:var(--red);font-size:13.5px;min-height:20px;margin-top:12px}

/* En-tête */
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:12px}
.hrow img{height:30px}
.hhi{flex:1;min-width:0}
.hhi .t{font-family:Poppins,Inter,sans-serif;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hhi .s{font-size:12.5px;color:var(--mut)}
.ibtn{width:38px;height:38px;border-radius:12px;border:0;background:var(--teal-50);color:var(--teal);display:flex;align-items:center;justify-content:center}
.ibtn svg{width:18px;height:18px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:500;background:#fff;color:var(--mut)}
.chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
.chip i{font-style:normal;opacity:.75;margin-left:4px}

main{padding:16px 14px calc(100px + env(safe-area-inset-bottom));max-width:640px;margin:0 auto}

/* Bandeau du jour */
.hero{background:#fff;border-radius:20px;padding:16px;margin-bottom:18px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 6px 20px rgba(12,124,144,.05)}
.hero .big{font-family:Poppins,Inter,sans-serif;font-size:19px;font-weight:600}
.hero .sm{color:var(--mut);font-size:13.5px;margin-top:2px}
.prog{height:8px;border-radius:8px;background:var(--teal-50);margin-top:12px;overflow:hidden}
.prog i{display:block;height:100%;border-radius:8px;background:var(--teal);transition:width .4s}

/* Groupes et cartes */
.grp{margin:20px 2px 8px;display:flex;align-items:baseline;gap:8px}
.grp .ttl{font-size:15px}
.grp .n{font-size:12.5px;color:var(--mut)}
.grp-hint{font-size:12.5px;color:var(--mut);margin:-4px 2px 10px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 4px 14px rgba(12,124,144,.05)}
.ctop{display:flex;gap:12px;align-items:center}
.av{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.av.e{background:var(--teal-50);color:var(--teal)}.av.f{background:var(--or-50);color:var(--or)}.av.a{background:var(--vio-50);color:var(--vio)}
.cinfo{flex:1;min-width:0}
.nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:13px;color:var(--mut);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flag{font-size:11.5px;font-weight:600;border-radius:8px;padding:3px 7px;flex:none}
.flag.hot{background:var(--red-50);color:var(--red)}
.flag.rdv{background:var(--vio-50);color:var(--vio)}
.flag.warn{background:var(--or-50);color:#B35A14}
.cact{display:flex;gap:8px;margin-top:12px}
.b{flex:1;border:0;border-radius:13px;padding:11px 10px;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
.b svg{width:17px;height:17px;flex:none}
.b.wa{background:var(--wa);color:#fff}
.b.pri{background:var(--teal);color:#fff}
.b.soft{background:var(--teal-50);color:var(--teal)}
.b.ghost{background:#F1F4F5;color:#4E6166;flex:0 0 auto;padding:11px 14px}
.b.orange{background:var(--or-50);color:#B35A14}
.b:disabled{opacity:.5}
.empty{text-align:center;color:var(--mut);padding:48px 20px}
.empty .e{font-size:44px;margin-bottom:8px}
.more{width:100%;border:1px dashed #CFDCDF;background:transparent;border-radius:14px;padding:12px;color:var(--mut);font-size:13.5px;margin-top:6px}

/* Recherche, formulaires */
.search{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:#fff;outline:none;margin-bottom:10px}
.in,.sel{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px 12px;background:#fff;outline:none}
.in:focus,.sel:focus,.search:focus{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-100)}
textarea.in{min-height:90px;resize:vertical}
.lbl{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin:14px 0 6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12.5px;color:var(--mut);margin-top:8px}
.seg{display:flex;background:#EEF3F4;border-radius:13px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:9px 4px;font-size:13.5px;font-weight:500;color:var(--mut)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.box{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:0 1px 2px rgba(0,0,0,.03),0 4px 14px rgba(12,124,144,.05)}
.box h3{font-size:15px;margin-bottom:4px}

/* Navigation */
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:6px 2px;font-size:11px;font-weight:500;color:#93A3A7;display:flex;flex-direction:column;align-items:center;gap:3px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--teal);font-weight:600}
nav .dot{position:relative}
nav .dot b{position:absolute;top:-4px;right:-10px;background:var(--or);color:#fff;font-size:10px;border-radius:9px;padding:1px 5px;font-weight:600}

/* Fiche (panneau du bas) */
.ov{position:fixed;inset:0;background:rgba(15,40,46,.35);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:92vh;display:flex;flex-direction:column;background:var(--bg);border-radius:24px 24px 0 0;z-index:60;transform:translateY(105%);transition:transform .25s ease;max-width:640px;margin:0 auto}
.sheet.open{transform:none}
.shead{padding:10px 16px 12px;background:#fff;border-radius:24px 24px 0 0;border-bottom:1px solid var(--line)}
.grab{width:40px;height:4px;border-radius:4px;background:#D5E0E2;margin:0 auto 12px}
.sbody{overflow-y:auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
.qa{display:flex;gap:8px;margin-top:12px}
.qa a,.qa button{flex:1;border:0;border-radius:13px;padding:10px 4px;font-size:12.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--teal-50);color:var(--teal)}
.qa svg{width:19px;height:19px}
.qa .wa{background:#E8F7EE;color:var(--wa)}
.tabs{display:flex;gap:4px;margin-top:12px;background:#EEF3F4;border-radius:12px;padding:3px}
.tabs button{flex:1;border:0;background:none;border-radius:9px;padding:8px 2px;font-size:13px;font-weight:500;color:var(--mut)}
.tabs button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.msg{white-space:pre-wrap;font-size:14px;line-height:1.5;background:#F7FAFA;border:1px solid var(--line);border-radius:14px;padding:12px}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 12px;font-size:14px}
.kv .k{color:var(--mut)}
.tpl{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.tpl::-webkit-scrollbar{display:none}
.tpl button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:12.5px;font-weight:500;color:var(--teal-d)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut);margin-top:10px}
.hist{border-left:2px solid var(--teal-100);margin-left:6px;padding-left:14px}
.hi{position:relative;padding-bottom:14px;font-size:13.5px}
.hi:before{content:"";position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--teal)}
.hi .d{font-size:12px;color:var(--mut)}
.hi .x{color:var(--mut);margin-top:2px;white-space:pre-wrap}
.savebar{position:sticky;bottom:-24px;background:linear-gradient(rgba(245,248,248,0),var(--bg) 30%);padding:14px 0 6px;margin-top:6px}

/* Résultats */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{background:var(--teal-50);border-radius:14px;padding:12px 6px;text-align:center}
.kpi b{display:block;font-family:Poppins,Inter,sans-serif;font-size:21px;font-weight:600;color:var(--teal-d)}
.kpi span{font-size:11.5px;color:var(--mut)}
.row{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #F0F4F5;font-size:14px}
.row:last-child{border-bottom:0}
.row .v{font-weight:600;white-space:nowrap}
.row .o{color:var(--mut);font-weight:400}
.bar{height:5px;border-radius:5px;background:#EDF3F4;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--or)}
.team{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:8px}
.team th{font-weight:500;color:var(--mut);font-size:12px;text-align:center;padding:6px 2px}
.team th:first-child,.team td:first-child{text-align:left}
.team td{text-align:center;padding:9px 2px;border-top:1px solid #F0F4F5}
.team td b{font-weight:600}

/* Modale d'appel */
.modal{position:fixed;left:16px;right:16px;top:50%;transform:translateY(-50%) scale(.96);background:#fff;border-radius:22px;padding:20px;z-index:70;opacity:0;pointer-events:none;transition:all .2s;max-width:420px;margin:0 auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal.open{opacity:1;pointer-events:auto;transform:translateY(-50%) scale(1)}
.modal h3{font-size:17px;margin-bottom:4px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;text-align:left;font-size:14.5px;font-weight:500}
.opt.on{border-color:var(--teal);background:var(--teal-50);color:var(--teal-d)}

.toast{position:fixed;left:14px;right:14px;bottom:calc(84px + env(safe-area-inset-bottom));background:#173238;color:#fff;border-radius:14px;padding:12px 14px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:80;opacity:0;visibility:hidden;transform:translateY(16px);transition:all .2s;max-width:560px;margin:0 auto}
.toast.show{transform:none;opacity:1;visibility:visible}
.toast button{background:none;border:0;color:#FFC796;font-weight:600;font-size:14px;white-space:nowrap}
.loader{position:fixed;top:0;left:0;right:0;height:2px;z-index:90;background:var(--teal);transform-origin:left;animation:ld 1s infinite;display:none}
@keyframes ld{0%{transform:scaleX(0)}100%{transform:scaleX(1);opacity:.3}}
</style>
</head>
<body>
<div class="loader" id="loader"></div>

<section id="login">
  <div class="lcard">
    <img src="logo.png" alt="Educ'Assure">
    <h2>Espace équipe</h2>
    <p>Entre ton code d'accès à 6 chiffres</p>
    <input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="••••••">
    <button class="btn-main" data-act="login">Entrer</button>
    <div class="lerr" id="lerr"></div>
  </div>
</section>

<section id="app" class="hide">
  <header>
    <div class="hrow">
      <img src="logo.png" alt="Educ'Assure">
      <div class="hhi"><div class="t" id="hello">Bonjour</div><div class="s" id="sub"></div></div>
      <button class="ibtn" data-act="reload" title="Actualiser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    </div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="main"></main>
  <nav>
    <button id="t-today" class="on" data-act="tab" data-t="today"><span class="dot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg><b id="navn" class="hide"></b></span>Aujourd'hui</button>
    <button id="t-all" data-act="tab" data-t="all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>Prospects</button>
    <button id="t-new" data-act="tab" data-t="new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Ajouter</button>
    <button id="t-dash" data-act="tab" data-t="dash"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M12 20V5M19 20v-6"/></svg>Résultats</button>
  </nav>
</section>

<div class="ov" id="ov" data-act="closeall"></div>
<div class="sheet" id="sheet"></div>
<div class="modal" id="modal"></div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn"></button></div>

<script>
var API='https://script.google.com/macros/s/AKfycbzfvLiFU8IE-GTQ3zO8PU5iuPGVtyzQabbeIbq4WukPozalpnaHG8FY6HO4w_Ah/exec';
var S={pin:'',data:null,tab:'today',kind:'Tous',q:'',etape:'',dash:null,team:null,period:'sem',cur:null,ftab:'',showOubli:false,newKind:'Études'};
var KINDS=['Études','Formations','Autres'];
var ICON={'Études':'🎓','Formations':'🗣️','Autres':'📄'};
var AV={'Études':'e','Formations':'f','Autres':'a'};
var MAIN={'Études':'Destination','Formations':'Formation','Autres':'Service demandé'};
var ICO={
  wa:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1-.7-.3-1.9-.8-2.9-2.4-.2-.4.2-.4.6-1.2.1-.2 0-.3 0-.4l-.8-1.9c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.4.1-.6.3s-.8.8-.8 2 .8 2.3.9 2.5c.1.2 1.6 2.5 4 3.5 1.5.6 2.1.7 2.8.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.2-1.2c-.1-.1-.2-.2-.4-.3z"/></svg>',
  tel:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  pen:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14l-5-5 5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>'
};
var GROUPS=[
  {id:'num',  ttl:'📵 Numéros à vérifier', hint:'Le numéro semble faux : corrige-le avant d\'envoyer le message.', btn:'Corriger le numéro'},
  {id:'rdv',  ttl:'📅 Rendez-vous à rappeler', hint:'Le RDV est aujourd\'hui ou demain : un petit rappel.', btn:'Rappeler le RDV'},
  {id:'cb',   ttl:'📞 Personnes à rappeler', hint:'Tu avais prévu de les rappeler aujourd\'hui.', btn:'Appeler'},
  {id:'msg',  ttl:'✉️ Premiers messages', hint:'Nouvelle fiche ou nouvelle étape : le message est prêt.', btn:'Envoyer'},
  {id:'rel',  ttl:'🔁 Relances', hint:'Pas encore de réponse : on relance gentiment.', btn:'Relancer'},
  {id:'maj',  ttl:'✏️ À mettre à jour', hint:'Dis comment ça s\'est passé pour garder le suivi juste.', btn:'Mettre à jour'}
];
var TPL=[
 ['🇬🇧 Anglais','Bonjour {p}, la formation en anglais démarre le lundi 11 janvier 2027 : 3 mois, 3 séances de 2h par semaine, 65 000 F. Les frais d\'inscription (10 000 F) sont offerts si vous vous inscrivez avant le 31 décembre. Souhaitez-vous réserver votre place ?'],
 ['🇯🇵 Japonais','Bonjour {p}, la formation en japonais démarre le mardi 12 janvier 2027 : 3 séances de 2h par semaine, 50 000 F par mois. Les frais d\'inscription (10 000 F) sont offerts avant le 31 décembre. Souhaitez-vous réserver votre place ?'],
 ['📅 Proposer un RDV','Bonjour {p}, je vous propose un rendez-vous à notre agence pour étudier votre projet ensemble. Quel jour et quelle heure vous conviennent cette semaine ?'],
 ['📄 Documents','Bonjour {p}, pour avancer sur votre dossier, merci de nous envoyer : copie du passeport (ou CNIB), derniers bulletins et relevés de notes, diplômes obtenus. Vous pouvez les envoyer ici en photo ou en PDF.'],
 ['📍 Contacts','Educ\'Assure — WhatsApp : +226 68 53 53 94 · Appels : 51 63 44 44 / 54 44 00 44 · E-mail : assureeduc@gmail.com. N\'hésitez pas à passer nous voir !'],
 ['🙏 Merci','Bonjour {p}, merci pour votre confiance ! Nous restons disponibles pour toute question.']
];

/* ---------- Outils ---------- */
function $(id){ return document.getElementById(id); }
function store(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function stored(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
function fd(iso){ if(!iso||iso.indexOf('-')<0) return iso||''; var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fds(iso){ if(!iso) return ''; var p=iso.split('-'); var M=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.']; return Number(p[2])+' '+M[Number(p[1])-1]; }
function addDays(iso,n){ var d=new Date(iso+'T12:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function fmtF(n){ return n===''||n==null?'':Number(n).toLocaleString('fr-FR')+' F'; }
function msgOf(e){ return String(e && e.message ? e.message : e).replace('CODE: ',''); }
function err(e){ toast('⚠️ '+esc(msgOf(e))); }
function initials(n){ var p=String(n).trim().split(/\s+/); return ((p[0]||'')[0]||'').toUpperCase()+((p[1]||'')[0]||'').toUpperCase(); }
function busy(b){ $('loader').style.display=b?'block':'none'; }
function run(fn){ var args=[].slice.call(arguments,1); busy(true);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})
    .then(function(r){ return r.json(); })
    .catch(function(){ throw new Error('Connexion impossible. Vérifie internet puis réessaie.'); })
    .then(function(j){ busy(false); if(j.ok) return j.r;
      if(/CODE:/.test(j.error) && fn!=='login') logout(true); throw new Error(j.error); },
      function(e){ busy(false); throw e; });
}
function today(){ return S.data ? S.data.today : new Date().toISOString().slice(0,10); }
function canWrite(){ return S.data && S.data.ecriture; }
function key(p){ return p.kind+'|'+p.row; }
function find(k){ var x=k.split('|'); return S.data.kinds[x[0]].filter(function(p){return p.row==x[1]})[0]; }
function waUrl(num,text){ return 'https://wa.me/'+encodeURIComponent(num)+(text?'?text='+encodeURIComponent(text):''); }
function mainDetail(p){ var d=p.details.filter(function(x){return x[0]===MAIN[p.kind]})[0]; return d?d[1]:''; }
function keep(){ try{ localStorage.setItem('ea_data',JSON.stringify(S.data)); }catch(e){} }
function doneKey(){ return 'ea_done_'+today(); }
function bumpDone(){ store(doneKey(),String((Number(stored(doneKey()))||0)+1)); }

/* ---------- Connexion ---------- */
function doLogin(){
  var pin=$('pin').value.trim(), le=$('lerr');
  if(pin.length<6){ le.textContent='Le code a 6 chiffres.'; return; }
  le.textContent='';
  run('login',pin).then(function(){ S.pin=pin; store('ea_pin',pin); start(); }).catch(function(e){ le.textContent=msgOf(e); });
}
function logout(silent){ store('ea_pin',null); store('ea_data',null); store('ea_dash',null); S.pin=''; S.data=null;
  $('app').className='hide'; $('login').className=''; $('pin').value='';
  $('lerr').textContent = silent===true ? 'Code expiré ou modifié : entre ton code.' : ''; }
function start(){ $('login').className='hide'; $('app').className='';
  if(!S.data){ try{ var c=JSON.parse(stored('ea_data')||'null'); if(c && c.kinds){ S.data=c; hello(); } }catch(e){} }
  render(); load(); }
function hello(){ var d=S.data; $('hello').textContent='Bonjour '+d.user+' 👋';
  var j=new Date(d.today+'T12:00:00Z').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'});
  $('sub').textContent=j.charAt(0).toUpperCase()+j.slice(1)+(d.ecriture?'':' · consultation'); }
function load(){ return run('getData',S.pin).then(function(d){ S.data=d; hello(); keep(); render(); if(S.tab==='dash') loadDash(); }).catch(err); }

/* ---------- Classement du jour ---------- */
function all(){ var a=[]; if(!S.data) return a; KINDS.forEach(function(k){ a=a.concat(S.data.kinds[k]); }); return a.filter(function(p){ return p.doublon!=='Doublon'; }); }
function groupOf(p){ var g=groupBase(p); return (g && g!=='maj' && p.numBad) ? 'num' : g; }
function groupBase(p){
  if(p.action==='RAPPEL RDV') return 'rdv';
  if(p.callback && p.callback<=today()) return 'cb';
  if(p.action==='Message à envoyer') return 'msg';
  if(p.action==='RELANCER') return 'rel';
  if(p.action==='RDV passé' || p.action.indexOf('Passer')===0) return 'maj';
  return '';
}
function isClosed(p){ return /^(Dossier ouvert|Inscrit et payé|En cours|Terminé|Perdu|En veille)$/.test(p.etape); }
function isForgotten(p){
  if(groupOf(p) || isClosed(p) || !(p.action==='' || p.action==='Attente réponse')) return false;
  var lastC=[p.lastAct||'',p.last||'',p.date||''].sort().pop();
  return lastC && lastC<=addDays(today(),-10);
}
function byPrio(a,b){ var pa=a.prio==='PRIORITÉ'?0:1, pb=b.prio==='PRIORITÉ'?0:1; return pa-pb || (a.date||'').localeCompare(b.date||''); }

/* ---------- Affichage ---------- */
function setChips(base){
  var ch=$('chips');
  if(S.tab==='new'||S.tab==='dash'){ ch.innerHTML=''; ch.className='chips hide'; return; }
  ch.className='chips';
  ch.innerHTML=['Tous'].concat(KINDS).map(function(k){ var n=base.filter(function(p){return k==='Tous'||p.kind===k}).length;
    return '<button class="chip'+(S.kind===k?' on':'')+'" data-act="kind" data-k="'+k+'">'+(ICON[k]?ICON[k]+' ':'')+k+'<i>'+n+'</i></button>'; }).join('');
}
function tab(t,fromBack){
  if(!fromBack && t!==S.tab){ try{ history.pushState({ea:'tab',t:t},''); }catch(e){} }
  S.tab=t; ['today','all','new','dash'].forEach(function(x){ $('t-'+x).className=(x===t?'on':''); });
  render(); if(t==='dash') loadDash(); window.scrollTo(0,0);
}
function render(){
  var m=$('main');
  if(!S.data){ setChips([]); m.innerHTML='<div class="empty"><div class="e">⏳</div>Chargement…</div>'; return; }
  var list=all(), todo=list.filter(function(p){return groupOf(p)});
  var nb=$('navn'); nb.textContent=todo.length; nb.className=todo.length?'':'hide';
  if(S.tab==='today') return renderToday(list,todo);
  if(S.tab==='all') return renderAll(list);
  if(S.tab==='new') return renderNew();
  if(S.tab==='dash') return renderDash(list,todo);
}
function renderToday(list,todo){
  setChips(todo);
  var shown=todo.filter(function(p){return S.kind==='Tous'||p.kind===S.kind});
  var done=Number(stored(doneKey()))||0, tot=done+todo.length, pct=tot?Math.round(done/tot*100):100;
  var h='<div class="hero"><div class="big">'+(todo.length?(todo.length+' action'+(todo.length>1?'s':'')+' pour aujourd\'hui'):'Tout est à jour 🎉')+'</div>'+
    '<div class="sm">'+(done?done+' déjà faite'+(done>1?'s':'')+' · ':'')+(todo.length?'Commence par le haut : le plus urgent est en premier.':'Aucun message ni relance en attente.')+'</div>'+
    '<div class="prog"><i style="width:'+pct+'%"></i></div></div>';
  GROUPS.forEach(function(g){
    var items=shown.filter(function(p){return groupOf(p)===g.id}).sort(byPrio);
    if(!items.length) return;
    h+='<div class="grp"><span class="ttl">'+g.ttl+'</span><span class="n">'+items.length+'</span></div><div class="grp-hint">'+g.hint+'</div>'+items.map(function(p){return card(p,g)}).join('');
  });
  var forg=list.filter(isForgotten).filter(function(p){return S.kind==='Tous'||p.kind===S.kind});
  if(forg.length){
    h+='<button class="more" data-act="oubli">😴 '+forg.length+' prospect'+(forg.length>1?'s':'')+' sans nouvelles depuis 10 jours '+(S.showOubli?'▲':'▼')+'</button>';
    if(S.showOubli) h+='<div style="margin-top:10px">'+forg.sort(byPrio).map(function(p){return card(p,null)}).join('')+'</div>';
  }
  $('main').innerHTML=h;
}
function renderAll(list){
  setChips(list);
  var q=S.q.toLowerCase(), et=[]; list.forEach(function(p){ if(p.etape && et.indexOf(p.etape)<0) et.push(p.etape) });
  var shown=list.filter(function(p){ return (S.kind==='Tous'||p.kind===S.kind) && (!S.etape||p.etape===S.etape||(S.etape==='(vide)'&&!p.etape)) &&
      (!q || (p.nom+' '+p.wa+' '+p.details.map(function(d){return d[1]}).join(' ')).toLowerCase().indexOf(q)>=0); })
    .sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || b.row-a.row; });
  $('main').innerHTML='<input class="search" id="q" placeholder="Rechercher un nom, un numéro, un pays…" value="'+esc(S.q)+'">'+
    '<select class="sel" id="fet" style="margin-bottom:14px"><option value="">Toutes les étapes</option><option value="(vide)"'+(S.etape==='(vide)'?' selected':'')+'>Sans étape</option>'+
    et.sort().map(function(e){return '<option'+(S.etape===e?' selected':'')+'>'+esc(e)+'</option>'}).join('')+'</select>'+
    '<div class="grp-hint">'+shown.length+' prospect'+(shown.length>1?'s':'')+'</div>'+shown.slice(0,150).map(function(p){return card(p,null)}).join('');
}
function card(p,g){
  var k=key(p), sub=[ICON[p.kind]+' '+(mainDetail(p)||p.kind), p.etape||'Nouveau'];
  var flags='';
  if(p.prio==='PRIORITÉ') flags+='<span class="flag hot">🔥 Priorité</span>';
  else if(p.rdv && p.rdv>=today()) flags+='<span class="flag rdv">'+fds(p.rdv)+(p.heure?' · '+p.heure.replace(':','h'):'')+'</span>';
  else if(p.noRdv) flags+='<span class="flag warn">Date RDV ?</span>';
  if(p.numBad && !isClosed(p)) flags='<span class="flag hot">📵 Numéro ?</span>';
  var act='';
  if(g && canWrite()){
    if(g.id==='num') act='<button class="b orange" data-act="fixnum" data-k="'+k+'">📵 '+g.btn+'</button>';
    else if(g.id==='cb') act='<a class="b pri" href="tel:+'+esc(p.num)+'" data-act="call" data-k="'+k+'">'+ICO.tel+'Appeler</a>';
    else if(g.id==='maj') act='<button class="b orange" data-act="open" data-k="'+k+'" data-ft="suivi">'+ICO.pen+(p.action==='RDV passé'?'Comment s\'est passé le RDV ?':p.action==='Passer en veille'?'Passer en veille ?':'Classer en perdu ?')+'</button>';
    else if(p.msg) act='<a class="b wa" href="'+waUrl(p.num,p.msg)+'" target="_blank" rel="noopener" data-act="sent" data-k="'+k+'">'+ICO.wa+g.btn+'</a>';
    if(g.id==='rel') act+='<button class="b ghost" data-act="replied" data-k="'+k+'" title="A répondu">'+ICO.back+'</button>';
  } else if(!g && canWrite()){
    act='<a class="b soft" href="'+waUrl(p.num)+'" target="_blank" rel="noopener">'+ICO.wa+'WhatsApp</a><a class="b soft" href="tel:+'+esc(p.num)+'" data-act="call" data-k="'+k+'">'+ICO.tel+'Appeler</a>';
  }
  return '<div class="card"><div class="ctop" data-act="open" data-k="'+k+'"><div class="av '+AV[p.kind]+'">'+esc(initials(p.nom))+'</div>'+
    '<div class="cinfo"><div class="nm">'+esc(p.nom)+'</div><div class="sub">'+esc(sub.join(' · '))+(g&&g.id==='rel'?' · relance '+(p.rel+1)+'/'+p.maxRel:'')+'</div></div>'+flags+'</div>'+
    (act?'<div class="cact">'+act+'<button class="b ghost" data-act="open" data-k="'+k+'">Fiche</button></div>':'')+'</div>';
}

/* ---------- Fiche ---------- */
function openSheet(k,ft){
  var p=find(k); if(!p) return; S.cur=k; S.hist=null;
  var sendable=p.msg && /^(Message à envoyer|RELANCER|RAPPEL RDV|RDV prévu)$/.test(p.action);
  S.ftab = ft || (sendable && canWrite() ? 'msg' : 'suivi');
  var sh=$('sheet');
  sh.innerHTML='<div class="shead"><div class="grab"></div><div class="ctop"><div class="av '+AV[p.kind]+'" style="width:48px;height:48px">'+esc(initials(p.nom))+'</div>'+
    '<div class="cinfo"><div class="nm" style="font-size:17px">'+esc(p.nom)+'</div><div class="sub">'+ICON[p.kind]+' '+esc(mainDetail(p)||p.kind)+' · '+esc(p.etape||'Nouveau')+'</div></div></div>'+
    '<div class="qa"><a class="wa" href="'+waUrl(p.num)+'" target="_blank" rel="noopener">'+ICO.wa+'WhatsApp</a><a href="tel:+'+esc(p.num)+'" data-act="call" data-k="'+k+'">'+ICO.tel+'Appeler</a>'+
    (canWrite()?'<button data-act="ftab" data-ft="msg">'+ICO.pen+'Écrire</button>':'')+'</div>'+
    '<div class="tabs" id="ftabs"></div></div><div class="sbody" id="sbody"></div>';
  drawFtab();
  if(sh.className!=='sheet open'){ try{ history.pushState({ea:'sheet'},''); }catch(e){} }
  $('ov').className='ov open'; sh.className='sheet open';
}
function drawFtab(){
  var p=find(S.cur), w=canWrite(), T=[['suivi','Suivi'],['msg','Message'],['hist','Historique'],['info','Infos']].filter(function(t){return w||t[0]!=='msg'});
  $('ftabs').innerHTML=T.map(function(t){return '<button class="'+(S.ftab===t[0]?'on':'')+'" data-act="ftab" data-ft="'+t[0]+'">'+t[1]+'</button>'}).join('');
  var b=$('sbody'), h='';
  if(S.ftab==='msg'){
    if(p.numBad) h+='<div class="box" style="background:var(--red-50)"><b style="color:var(--red)">📵 Attention : numéro douteux</b><div class="hint" style="margin:4px 0 10px;color:var(--ink)">'+esc(p.numBad)+'. Le message risque de ne pas arriver.</div><button class="b orange" style="width:100%" data-act="fixnum" data-k="'+S.cur+'">Corriger le numéro</button></div>';
    var sendable=p.msg && /^(Message à envoyer|RELANCER|RAPPEL RDV|RDV prévu)$/.test(p.action);
    if(sendable){
      h+='<div class="box"><h3>'+(p.action==='RDV prévu'?'Confirmation du RDV (facultatif)':'Message prévu')+'</h3><div class="hint" style="margin:0 0 10px">'+
        (p.action==='RELANCER'?'Relance '+(p.rel+1)+' sur '+p.maxRel+'.':p.action==='RAPPEL RDV'?'Rappel du rendez-vous.':p.action==='RDV prévu'?'Le RDV est fixé : ce message n\'est pas obligatoire.':'Premier message de cette étape.')+'</div>'+
        '<div class="msg">'+esc(p.msg)+'</div><div class="cact"><a class="b wa" href="'+waUrl(p.num,p.msg)+'" target="_blank" rel="noopener" data-act="sent" data-k="'+S.cur+'" data-close="1">'+ICO.wa+'Envoyer ce message</a></div></div>';
    }
    h+='<div class="box"><h3>'+(sendable?'Ou écrire un autre message':'Écrire un message')+'</h3><div class="hint" style="margin:0 0 10px">Choisis un modèle ou écris librement.</div>'+
      '<div class="tpl">'+TPL.map(function(t,i){return '<button data-act="tpl" data-i="'+i+'">'+t[0]+'</button>'}).join('')+'</div>'+
      '<textarea class="in" id="f-libre" placeholder="Bonjour '+esc(p.nom)+', …"></textarea>'+
      '<label class="chk"><input type="checkbox" id="f-wait" checked> J\'attends sa réponse (relances automatiques)</label>'+
      '<div class="cact"><button class="b wa" data-act="free">'+ICO.wa+'Envoyer sur WhatsApp</button></div></div>';
  } else if(S.ftab==='suivi'){
    var L=S.data.lists[p.kind], dis=w?'':' disabled';
    var opts=function(arr,v){ return '<option value=""></option>'+arr.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join(''); };
    var et=S.closing||p.etape; S.closing=null;
    h+='<div class="box">';
    if(p.action==='RDV passé') h+='<div class="hint" style="margin:0 0 6px;color:#B35A14">Le RDV du '+fds(p.rdv)+' est passé : choisis la nouvelle étape (ex. « Proposition envoyée ») ou change la date s\'il est reporté.</div>';
    h+='<label class="lbl" style="margin-top:0">Étape</label><select class="sel" id="f-etape"'+dis+'>'+opts(L.etapes,et)+'</select>'+
      (p.hasRdv?'<label class="lbl">'+(p.kind==='Études'?'Entretien':'Test')+' : date et heure</label><div class="two"><input class="in" type="date" id="f-rdv" value="'+esc(p.rdv)+'"'+dis+'>'+(p.hasHeure?'<input class="in" type="time" id="f-heure" value="'+esc(p.heure)+'"'+dis+'>':'<span></span>')+'</div>':'')+
      '<label class="lbl">Dernier message sans réponse</label><div class="two"><input class="in" type="date" id="f-last" value="'+esc(p.last)+'"'+dis+'>'+
        '<select class="sel" id="f-rel"'+dis+'>'+[0,1,2,3,4,5].filter(function(n){return n<=p.maxRel}).map(function(n){return '<option value="'+n+'"'+(n===p.rel?' selected':'')+'>'+n+' relance'+(n>1?'s':'')+'</option>'}).join('')+'</select></div>'+
      (w?'<div class="cact"><button class="b soft" data-act="lastToday">📤 Envoyé aujourd\'hui</button><button class="b soft" data-act="lastClear">↩︎ A répondu</button></div>':'')+
      '<label class="lbl">Montant encaissé (FCFA)</label><input class="in" type="number" inputmode="numeric" id="f-montant" value="'+esc(p.montant)+'"'+dis+'>'+
      '<label class="lbl">Raison de la perte <span style="font-weight:400">(si perdu)</span></label><select class="sel" id="f-raison"'+dis+'>'+opts(S.data.lists.raisons,p.raison)+'</select>'+
      (p.kind!=='Autres'?'<label class="lbl">Responsable</label><select class="sel" id="f-resp"'+dis+'>'+opts(S.data.lists.resp,p.resp)+'</select>':'')+
      '<label class="lbl">Notes</label><textarea class="in" id="f-notes"'+dis+'>'+esc(p.notes)+'</textarea>'+
      (w?'<div class="savebar"><button class="btn-main" style="margin:0" id="saveBtn" data-act="save">Enregistrer</button></div><div class="hint">Changer l\'étape lance automatiquement les messages de la nouvelle étape.</div>':'')+'</div>';
  } else if(S.ftab==='hist'){
    if(!S.hist){ h='<div class="empty"><div class="e">🕘</div>Chargement…</div>';
      run('getHistory',S.pin,p.kind,p.row,p.nom).then(function(r){ S.hist=r; if(S.ftab==='hist') drawFtab(); }).catch(err); }
    else if(!S.hist.length) h='<div class="empty"><div class="e">🕘</div>Rien encore. Les envois, appels et changements faits dans l\'appli apparaîtront ici.</div>';
    else h='<div class="box"><div class="hist">'+S.hist.map(function(x){return '<div class="hi"><div class="d">'+esc(x[0])+' · '+esc(x[1])+'</div><b>'+esc(x[2])+'</b>'+(x[3]?'<div class="x">'+esc(x[3])+'</div>':'')+'</div>'}).join('')+'</div></div>';
  } else {
    h=(p.numBad?'<div class="box" style="background:var(--red-50)"><b style="color:var(--red)">📵 Numéro douteux</b><div class="hint" style="margin:4px 0 10px;color:var(--ink)">'+esc(p.numBad)+' : « '+esc(p.wa)+' ».</div>'+(w?'<button class="b orange" style="width:100%" data-act="fixnum" data-k="'+S.cur+'">Corriger le numéro</button>':'')+'</div>':'')+
      '<div class="box"><div class="kv"><div class="k">Numéro</div><div>'+esc(p.wa)+(w&&!p.numBad?' · <a style="color:var(--teal);font-weight:600" data-act="fixnum" data-k="'+S.cur+'">corriger</a>':'')+'</div>'+
      (p.date?'<div class="k">Fiche reçue</div><div>'+fd(p.date)+'</div>':'')+
      p.details.map(function(d){return '<div class="k">'+esc(d[0])+'</div><div>'+esc(d[1])+'</div>'}).join('')+
      (p.prio?'<div class="k">Priorité</div><div>🔥 '+esc(p.prio)+'</div>':'')+
      (p.last?'<div class="k">Dernier message</div><div>'+fd(p.last)+' · relance '+p.rel+'/'+p.maxRel+'</div>':'')+
      (p.callback?'<div class="k">À rappeler le</div><div>'+fd(p.callback)+'</div>':'')+'</div></div>';
  }
  b.innerHTML=h; b.scrollTop=0;
}
function hideOnlySheetKeep(){ $('sheet').className='sheet'; }
function hideSheet(){ $('ov').className='ov'; $('sheet').className='sheet'; $('modal').className='modal'; }
function closeSheet(){ var open=$('sheet').className==='sheet open'||$('modal').className==='modal open'; hideSheet(); if(open){ try{ if(history.state&&history.state.ea==='sheet') history.back(); }catch(e){} } }
function val(id){ var e=$(id); return e?e.value:undefined; }

/* ---------- Actions ---------- */
function replace(r){ var arr=S.data.kinds[r.kind]; for(var i=0;i<arr.length;i++) if(arr[i].row===r.row) arr[i]=r; keep(); }
function sent(k){
  var p=find(k), action=p.action;
  run('markSent',S.pin,p.kind,p.row,p.nom,action).then(function(res){ replace(res.row); bumpDone(); render();
    toast('Envoi noté ✓','Annuler',function(){ run('undoSent',S.pin,p.kind,p.row,p.nom,res.prev).then(function(r2){ replace(r2.row); render(); toast('Annulé'); }).catch(err); });
  }).catch(err);
}
function replied(k){ var p=find(k);
  run('markReplied',S.pin,p.kind,p.row,p.nom).then(function(res){ replace(res.row); bumpDone(); render(); toast('Relances arrêtées ✓','Mettre à jour',function(){ openSheet(k,'suivi'); }); }).catch(err); }
function save(){
  var p=find(S.cur), f={etape:val('f-etape'),montant:val('f-montant'),raison:val('f-raison'),notes:val('f-notes')};
  if(p.hasRdv) f.rdv=val('f-rdv');
  if(p.hasHeure) f.heure=val('f-heure');
  if(p.kind!=='Autres') f.resp=val('f-resp');
  var nl=val('f-last'), nr=Number(val('f-rel'));
  if(nl!==p.last || (nl && nr!==p.rel)){ f.last=nl; f.rel=nr; }
  if(f.etape==='Perdu' && !f.raison){ toast('Choisis la raison de la perte avant d\'enregistrer.'); return; }
  $('saveBtn').disabled=true;
  run('saveRow',S.pin,p.kind,p.row,p.nom,f).then(function(res){ replace(res.row); closeSheet(); render(); toast('Fiche enregistrée ✓'); })
    .catch(function(e){ var b=$('saveBtn'); if(b) b.disabled=false; err(e); });
}
function sendFree(){
  var p=find(S.cur), t=val('f-libre'); if(!t||!t.trim()){ toast('Écris ton message ou choisis un modèle.'); return; }
  var wait=$('f-wait').checked;
  window.open(waUrl(p.num,t.trim()),'_blank');

/* ---------- Mauvais numéros ---------- */
function numCheck(raw){
  var d=String(raw||'').replace(/[^0-9]/g,''); if(!d) return 'Numéro vide';
  if(d.indexOf('00')===0) d=d.slice(2);
  if(/^(\d)\1+$/.test(d)) return 'Numéro fictif';
  var loc=d.length===8?d:(d.length===11&&d.indexOf('226')===0?d.slice(3):null);
  if(loc && (/^(\d)\1+$/.test(loc) || /^(12345678|23456789|87654321)$/.test(loc))) return 'Numéro fictif';
  if(loc) return /^[0567]/.test(loc)?'':(/^2/.test(loc)?'Numéro fixe (pas de WhatsApp)':'Ne commence pas par 0, 5, 6 ou 7');
  if(d.indexOf('226')===0) return 'Il manque ou il y a trop de chiffres';
  if(d.length>=10&&d.length<=15) return '';
  return d.length<8?'Il manque des chiffres':'Nombre de chiffres incorrect';
}
function fixModal(k){
  var p=find(k); S.fixK=k; var m=$('modal');
  m.innerHTML='<h3>Numéro de '+esc(p.nom)+'</h3><div class="hint" style="margin:0">Numéro saisi : <b>'+esc(p.wa)+'</b>'+(p.numBad?' · '+esc(p.numBad):'')+'</div>'+
    '<label class="lbl">Bon numéro WhatsApp</label><input class="in" id="fx-num" type="tel" inputmode="tel" placeholder="70 12 34 56" value="'+esc(p.numBad?'':p.wa)+'">'+
    '<div class="hint" id="fx-hint">8 chiffres (ex. 06 65 42 40), avec ou sans +226. Pour l\'étranger, mets l\'indicatif (ex. +225…).</div>'+
    '<div class="cact"><button class="b ghost" data-act="closeall">Annuler</button><button class="b pri" id="fxBtn" data-act="fixsave">Enregistrer</button></div>'+
    '<button class="more" style="margin-top:12px" data-act="fixlost">Impossible à joindre → classer en Perdu</button>';
  $('ov').className='ov open'; m.className='modal open';
  try{ if(!(history.state&&history.state.ea==='sheet')) history.pushState({ea:'sheet'},''); }catch(e){}
  setTimeout(function(){ var i=$('fx-num'); if(i) i.focus(); },150);
}
function fixSave(){
  var p=find(S.fixK), n=val('fx-num').trim(), why=numCheck(n);
  if(!n){ toast('Entre le nouveau numéro.'); return; }
  if(why && why.indexOf('fixe')<0){ $('fx-hint').innerHTML='<span style="color:var(--red)">⚠️ '+esc(why)+'</span>'; return; }
  $('fxBtn').disabled=true;
  run('fixNumber',S.pin,p.kind,p.row,p.nom,n).then(function(){
    var d=n.replace(/[^0-9]/g,''); if(d.indexOf('00')===0) d=d.slice(2);
    p.wa=n; p.num=d.length===8?'226'+d:d; p.numBad=''; keep(); closeSheet(); render();
    toast('Numéro corrigé ✓ Le tableau se met à jour dans 1 à 2 minutes.');
  }).catch(function(e){ var b=$('fxBtn'); if(b) b.disabled=false; err(e); });
}
function fixLost(){
  var p=find(S.fixK), R=S.data.lists.raisons||[];
  var raison=R.filter(function(r){return /num|joindre|injoignable/i.test(r)})[0] || R.filter(function(r){return /^autre/i.test(r)})[0] || R[0] || '';
  var notes=(p.notes?p.notes+'\n':'')+'Numéro incorrect, impossible à joindre ('+fd(today())+')';
  run('saveRow',S.pin,p.kind,p.row,p.nom,{etape:'Perdu',raison:raison,notes:notes}).then(function(res){ replace(res.row); closeSheet(); render(); toast('Fiche classée en Perdu ✓'); }).catch(err);
}

/* ---------- Toast ---------- */
var tt=null;
function toast(msg,btn,fn){ var t=$('toast'); $('toastTxt').innerHTML=msg; var b=$('toastBtn');
  b.textContent=btn||''; b.style.display=btn?'block':'none'; b.onclick=function(){ t.className='toast'; if(fn) fn(); };
  t.className='toast show'; clearTimeout(tt); tt=setTimeout(function(){t.className='toast'},btn?6000:3000); }

/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]'); if(!el) return;
  var a=el.getAttribute('data-act'), k=el.getAttribute('data-k');
  switch(a){
    case 'login': doLogin(); break;
    case 'reload': load(); if(S.tab==='dash') loadDash(); break;
    case 'logout': logout(); break;
    case 'tab': tab(el.getAttribute('data-t')); break;
    case 'kind': S.kind=k; render(); break;
    case 'open': if(e.target.closest('a')) return; S.closing=null; openSheet(k,el.getAttribute('data-ft')); if(el.getAttribute('data-ft')==='suivi'){ var p=find(k); if(p.action==='Passer en veille'){ S.closing='En veille'; } else if(p.action==='Passer en Perdu'){ S.closing='Perdu'; } if(S.closing) drawFtab(); } break;
    case 'ftab': S.ftab=el.getAttribute('data-ft'); drawFtab(); break;
    case 'sent': if(el.getAttribute('data-close')) closeSheet(); sent(k); break;
    case 'replied': replied(k); break;
    case 'call': setTimeout(function(){ callReport(k||S.cur); },700); break;
    case 'cres': S.callRes=el.getAttribute('data-r'); [].forEach.call(document.querySelectorAll('.opt'),function(o){o.className='opt'+(o===el?' on':'')}); $('cdate').className=S.callRes==='rappeler'?'':'hide'; break;
    case 'csave': callSave(); break;
    case 'fixnum': e.preventDefault(); $('sheet').className==='sheet open' ? (hideOnlySheetKeep(), fixModal(k||S.cur)) : fixModal(k||S.cur); break;
    case 'fixsave': fixSave(); break;
    case 'fixlost': fixLost(); break;
    case 'closeall': closeSheet(); break;
    case 'tpl': var p2=find(S.cur), t=$('f-libre'); t.value=TPL[Number(el.getAttribute('data-i'))][1].replace('{p}',String(p2.nom).trim()); t.focus(); break;
    case 'free': sendFree(); break;
    case 'save': save(); break;
    case 'lastToday': $('f-last').value=today(); $('f-rel').value=0; break;
    case 'lastClear': $('f-last').value=''; $('f-rel').value=0; break;
    case 'oubli': S.showOubli=!S.showOubli; render(); break;
    case 'nk': S.newKind=k; renderNew(); break;
    case 'add': addP(); break;
    case 'per': S.period=el.getAttribute('data-p'); render(); break;
    case 'copyT': try{ navigator.clipboard.writeText(S.data.ntfy).then(function(){toast('Nom copié ✓')},function(){toast(esc(S.data.ntfy))}); }catch(x){ toast(esc(S.data.ntfy)); } break;
    case 'testN': run('testNotif',S.pin).then(function(){ toast('Notification envoyée ✓'); }).catch(err); break;
  }
});

document.addEventListener('blur',function(e){ if(e.target.id==='n-wa'){ var w=numCheck(e.target.value); if(e.target.value && w) toast('⚠️ Numéro : '+esc(w)+'. Vérifie avec la personne.'); } },true);

/* Touche retour */
window.addEventListener('popstate',function(e){
  if($('sheet').className==='sheet open'||$('modal').className==='modal open'){ hideSheet(); return; }
  var st=e.state||{};
  if(st.ea==='tab'){ tab(st.t,true); return; }

  if(S.pin){ try{ history.pushState({ea:'home'},''); }catch(x){} toast('Appuie encore sur retour pour quitter','Quitter',function(){ history.go(-2); }); }
});
try{ history.replaceState({ea:'root'},''); history.pushState({ea:'home'},''); }catch(e){}

(function(){ var p=stored('ea_pin'); if(p){ S.pin=p; start(); } })();
