<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C7C90">
<title>Suivi Educ'Assure</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Suivi EA">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--teal:#0C7C90;--teal-d:#08525F;--teal-dd:#063F49;--teal-l:#E7F4F6;--or:#F07C2B;--or2:#FAA538;--or-l:#FFF2E6;--red:#D33A3A;--red-l:#FDECEC;--vio:#6A4FC2;--vio-l:#F0ECFD;--ok:#1C9A55;--ok-l:#E4F6EC;--wa:#25D366;--wa-d:#14A84E;--ink:#122C33;--mut:#5F7176;--line:#E1ECEE;--bg:#F3F7F8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px}
h1,h2,h3{font-family:Poppins,Inter,sans-serif}
button{font-family:inherit}
.hide{display:none!important}
svg.ic{width:18px;height:18px;flex:none}
#login{min-height:100vh;background:radial-gradient(120% 70% at 20% 0%,#16A0B3 0%,var(--teal) 40%,var(--teal-dd) 100%);display:flex;align-items:center;justify-content:center;padding:24px}
.lcard{width:100%;max-width:380px;background:#fff;border-radius:26px;padding:28px 24px 24px;box-shadow:0 24px 60px rgba(0,0,0,.25);text-align:center}
.lcard img{width:190px}
.lcard h2{margin:14px 0 4px;font-size:21px;color:var(--teal-d)}
.lcard p{margin:0 0 18px;color:var(--mut);font-size:14px}
.pin{width:100%;font-size:30px;letter-spacing:12px;text-align:center;font-weight:800;border:2px solid var(--line);border-radius:16px;padding:12px 8px;color:var(--teal-dd);outline:none;font-family:Poppins,Inter,sans-serif}
.pin:focus{border-color:var(--teal)}
.bigbtn{width:100%;margin-top:14px;border:0;border-radius:16px;padding:15px;font-size:16px;font-weight:800;color:#fff;background:linear-gradient(90deg,var(--or),var(--or2));box-shadow:0 10px 24px rgba(240,124,43,.35)}
.lerr{color:var(--red);font-size:13.5px;font-weight:700;min-height:20px;margin-top:10px}
.lfoot{margin-top:16px;font-size:12px;color:var(--mut)}
header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--teal) 0%,var(--teal-d) 100%);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 0;border-radius:0 0 22px 22px;box-shadow:0 6px 20px rgba(8,82,95,.18)}
.hrow{display:flex;align-items:center;gap:10px}
.hlogo{background:#fff;border-radius:12px;padding:4px 7px;display:flex}
.hlogo img{height:30px}
.hhi{flex:1;min-width:0}
.hhi .t{font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hhi .s{font-size:12px;opacity:.8}
.ibtn{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.16);color:#fff;display:flex;align-items:center;justify-content:center}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:12px 0 0}
.st{background:rgba(255,255,255,.13);border-radius:14px;padding:8px 4px;text-align:center}
.st b{display:block;font-family:Poppins,Inter,sans-serif;font-size:20px;line-height:1.1}
.st span{font-size:10.5px;opacity:.85;font-weight:600}
.st.hot b{color:#FFD0A6}
.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;background:rgba(255,255,255,.14);color:#fff}
.chip.on{background:#fff;color:var(--teal-d)}
.chip i{font-style:normal;display:inline-block;min-width:20px;margin-left:5px;padding:1px 6px;border-radius:999px;background:var(--or);color:#fff;font-size:11.5px}
main{padding:14px 12px calc(96px + env(safe-area-inset-bottom))}
.sect{font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;margin:6px 4px 10px}
.card{background:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 3px 14px rgba(8,82,95,.07);position:relative;overflow:hidden}
.card.prio{box-shadow:0 3px 14px rgba(211,58,58,.14),inset 4px 0 0 var(--red)}
.ctop{display:flex;gap:11px;align-items:flex-start}
.av{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:Poppins,Inter,sans-serif;font-weight:700;font-size:15px;color:#fff;flex:none}
.av.e{background:linear-gradient(135deg,#13A0B4,var(--teal-d))}.av.f{background:linear-gradient(135deg,var(--or2),var(--or))}.av.a{background:linear-gradient(135deg,#8A73DA,var(--vio))}
.cinfo{flex:1;min-width:0}
.nm{font-weight:800;font-size:15.5px;line-height:1.25}
.meta{font-size:12.5px;color:var(--mut);margin-top:2px;line-height:1.35}
.act{flex:none;font-size:10.5px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;border-radius:9px;padding:5px 8px;text-align:center;max-width:110px}
.a-msg{background:var(--teal-l);color:var(--teal-d)}.a-rel{background:var(--or-l);color:#A04A12}.a-rdv{background:var(--vio-l);color:var(--vio)}.a-pas{background:var(--red-l);color:var(--red)}.a-none{background:#EEF2F3;color:#6A777B}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.bd{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--teal-l);color:var(--teal-d);white-space:nowrap}
.bd.or{background:var(--or-l);color:#A04A12}.bd.red{background:var(--red-l);color:var(--red)}.bd.vio{background:var(--vio-l);color:var(--vio)}.bd.ok{background:var(--ok-l);color:var(--ok)}.bd.grey{background:#EEF2F3;color:#6A777B}
.prev{margin-top:10px;font-size:13px;line-height:1.45;color:#2F474E;background:#F5F9FA;border-radius:14px;padding:9px 11px;max-height:64px;overflow:hidden;position:relative;border:1px solid #EAF2F3}
.prev:after{content:"";position:absolute;left:0;right:0;bottom:0;height:22px;background:linear-gradient(rgba(245,249,250,0),#F5F9FA)}
.btns{display:flex;gap:8px;margin-top:11px}
.b{flex:1;border:0;border-radius:14px;padding:12px 8px;font-size:14px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:7px;text-decoration:none;cursor:pointer}
.b.wa{background:linear-gradient(90deg,var(--wa-d),var(--wa));color:#fff;flex:1.7;box-shadow:0 6px 16px rgba(20,168,78,.25)}
.b.sec{background:var(--teal-l);color:var(--teal-d)}.b.ghost{background:#EEF2F3;color:#43555A}.b.or{background:linear-gradient(90deg,var(--or),var(--or2));color:#fff}.b.teal{background:var(--teal);color:#fff}
.b:disabled{opacity:.5}
.empty{text-align:center;color:var(--mut);padding:44px 20px}
.empty .big{font-size:46px}
.search{width:100%;border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;font-size:15px;background:#fff;margin-bottom:10px;outline:none}
.sel,.in{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;font-size:15px;background:#fff;font-family:inherit;color:var(--ink);outline:none}
.sel:focus,.in:focus,.search:focus{border-color:var(--teal)}
textarea.in{min-height:84px;resize:vertical}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));background:#fff;border-radius:22px;display:flex;z-index:30;box-shadow:0 10px 30px rgba(8,82,95,.18);padding:6px}
nav button{flex:1;border:0;background:none;padding:7px 2px;font-size:11px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:16px}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--teal);background:var(--teal-l)}
.ov{position:fixed;inset:0;background:rgba(6,35,42,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:93vh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;z-index:60;padding:10px 14px calc(26px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease}
.sheet.open{transform:none}
.grab{width:46px;height:5px;border-radius:5px;background:#CCDADD;margin:4px auto 12px}
.box{background:#fff;border-radius:20px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(8,82,95,.05)}
.box h3{margin:0 0 10px;font-size:14.5px;color:var(--teal-d);display:flex;align-items:center;gap:7px}
.kv{display:grid;grid-template-columns:112px 1fr;gap:6px 10px;font-size:13.5px}
.kv div:nth-child(odd){color:var(--mut)}
.kv div:nth-child(even){font-weight:600}
.fl{font-size:12px;font-weight:800;color:var(--teal-d);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
.msgfull{font-size:13.5px;line-height:1.5;background:#F5F9FA;border-radius:14px;padding:11px 12px;white-space:pre-wrap;border:1px solid #EAF2F3}
.hint{font-size:12px;color:var(--mut);margin-top:8px;line-height:1.4}
.tile{display:flex;align-items:flex-start;gap:14px;background:#fff;border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 3px 14px rgba(8,82,95,.07)}
.tile .av{width:52px;height:52px;font-size:22px}
.tile .tt{flex:1}
.tile .tt b{display:block;font-family:Poppins,Inter,sans-serif;font-size:16px}
.tile .tt span{font-size:12.5px;color:var(--mut)}
.mini{display:flex;gap:8px;margin-top:10px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpi{background:var(--teal-l);border-radius:16px;padding:11px 6px;text-align:center}
.kpi b{display:block;font-family:Poppins,Inter,sans-serif;font-size:23px;color:var(--teal-d)}
.kpi span{font-size:11px;color:var(--mut);font-weight:700}
.drow{padding:9px 0;border-bottom:1px solid #EEF4F5;font-size:13.5px}
.drow:last-child{border-bottom:0}
.drow .l{display:flex;justify-content:space-between;gap:10px}
.drow .v{font-weight:800;color:var(--teal-d);white-space:nowrap}
.drow .o{color:var(--mut);font-weight:600;font-size:12px}
.bar{height:6px;border-radius:6px;background:#E8F0F1;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--or),var(--or2))}
.toast{position:fixed;left:14px;right:14px;bottom:calc(92px + env(safe-area-inset-bottom));background:var(--teal-dd);color:#fff;border-radius:16px;padding:13px 15px;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;z-index:80;opacity:0;visibility:hidden;transform:translateY(20px);transition:all .2s;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{transform:none;opacity:1;visibility:visible}
.toast button{background:none;border:0;color:#FFD0A6;font-weight:800;font-size:14px}
.loader{position:fixed;top:0;left:0;right:0;height:3px;z-index:90;background:linear-gradient(90deg,var(--or),var(--or2));transform-origin:left;animation:ld 1s infinite;display:none}
@keyframes ld{0%{transform:scaleX(0)}100%{transform:scaleX(1);opacity:.2}}
</style>
</head>
<body>
<div class="loader" id="loader"></div>

<section id="login">
  <div class="lcard">
    <img id="logo1" alt="Educ'Assure">
    <h2>Espace équipe</h2>
    <p>Suivi des prospects · entre ton code d'accès</p>
    <input id="pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" placeholder="••••••" onkeyup="if(event.key==='Enter')doLogin()">
    <button class="bigbtn" onclick="doLogin()">Entrer</button>
    <div class="lerr" id="lerr"></div>
    <div class="lfoot">Educ'Assure · Ouagadougou</div>
  </div>
</section>

<section id="app" class="hide">
  <header>
    <div class="hrow">
      <div class="hlogo"><img id="logo2" alt="Educ'Assure"></div>
      <div class="hhi"><div class="t" id="hello">Bonjour</div><div class="s" id="sub"></div></div>
      <button class="ibtn" onclick="load()" title="Actualiser"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="ibtn" onclick="logout()" title="Se déconnecter"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 4h4v16h-4"/><path d="M10 8l-4 4 4 4"/><path d="M6 12h10"/></svg></button>
    </div>
    <div class="stats" id="stats"></div>
    <div class="chips" id="chips"></div>
  </header>
  <main id="main"></main>
  <nav>
    <button id="t-today" class="on" onclick="tab('today')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 12l5 5L20 6"/></svg>Aujourd'hui</button>
    <button id="t-all" onclick="tab('all')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c.6-3.4 3-5 6-5s5.4 1.6 6 5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 15c1.8.6 2.8 2.2 3 5"/></svg>Prospects</button>
    <button id="t-new" onclick="tab('new')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nouveau</button>
    <button id="t-dash" onclick="tab('dash')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Résultats</button>
  </nav>
</section>

<div class="ov" id="ov" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"><span id="toastTxt"></span><button id="toastBtn"></button></div>

function store(k,v){ try{ if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){} }
function stored(k){ try{ return localStorage.getItem(k)||''; }catch(e){ return ''; } }
var API='https://script.google.com/macros/s/AKfycbzfvLiFU8IE-GTQ3zO8PU5iuPGVtyzQabbeIbq4WukPozalpnaHG8FY6HO4w_Ah/exec';
function run(fn){ var args=[].slice.call(arguments,1); busy(true);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow'})
    .then(function(r){ return r.json(); })
    .catch(function(){ throw new Error('Connexion impossible. Vérifie internet puis réessaie.'); })
    .then(function(j){ busy(false); if(j.ok) return j.r;
      var e=new Error(j.error); if(/CODE:/.test(j.error) && fn!=='login') logout(true); throw e; },
      function(e){ busy(false); throw e; });
}
function busy(b){ document.getElementById('loader').style.display=b?'block':'none'; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
function fd(iso){ if(!iso) return ''; var p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
function fmtF(n){ return n===''||n==null?'':Number(n).toLocaleString('fr-FR')+' F'; }
function msgOf(e){ return String(e && e.message ? e.message : e).replace('CODE: ',''); }
function err(e){ toast('⚠️ '+esc(msgOf(e))); }
function initials(n){ var p=String(n).trim().split(/\s+/); return ((p[0]||'')[0]||'').toUpperCase()+((p[1]||'')[0]||'').toUpperCase(); }

function doLogin(){
  var pin=document.getElementById('pin').value.trim(), le=document.getElementById('lerr');
  if(pin.length<6){ le.textContent='Le code a 6 chiffres.'; return; }
  le.textContent='';
  run('login',pin).then(function(){ S.pin=pin; store('ea_pin',pin); start(); }).catch(function(e){ le.textContent=msgOf(e); });
}
function logout(silent){ store('ea_pin',null); S.pin=''; S.data=null; document.getElementById('app').className='hide'; document.getElementById('login').className=''; document.getElementById('pin').value='';
  document.getElementById('lerr').textContent = silent===true ? 'Code expiré ou modifié : entre ton code.' : ''; }
function start(){ document.getElementById('login').className='hide'; document.getElementById('app').className=''; render(); load(); }

function load(){
  run('getData',S.pin).then(function(d){ S.data=d;
    document.getElementById('hello').textContent='Bonjour '+d.user+' 👋';
    document.getElementById('sub').textContent=d.role+' · '+fd(d.today)+(d.ecriture?'':' · consultation');
    render(); if(S.tab==='dash') loadDash(); }).catch(err);
}
function all(){ var a=[]; if(!S.data) return a; ['Études','Formations','Autres'].forEach(function(k){ a=a.concat(S.data.kinds[k]); }); return a; }
function isTodo(p){ return !!ORDER[p.action]; }
function sortTodo(a,b){ var pa=(a.prio==='PRIORITÉ')?0:1, pb=(b.prio==='PRIORITÉ')?0:1; if(pa!==pb) return pa-pb; var oa=ORDER[a.action]||9, ob=ORDER[b.action]||9; if(oa!==ob) return oa-ob; return (a.date||'').localeCompare(b.date||''); }

function header(list,todo){
  var st=document.getElementById('stats'), ch=document.getElementById('chips');
  if(S.tab==='today'){
    var c=function(a){return todo.filter(function(p){return p.action===a}).length};
    var prio=todo.filter(function(p){return p.prio==='PRIORITÉ'}).length;
    st.innerHTML='<div class="st"><b>'+c('Message à envoyer')+'</b><span>Messages</span></div><div class="st"><b>'+c('RELANCER')+'</b><span>Relances</span></div><div class="st"><b>'+c('RAPPEL RDV')+'</b><span>Rappels RDV</span></div><div class="st hot"><b>'+prio+'</b><span>Priorité 🔥</span></div>';
  } else st.innerHTML='';
  if(S.tab==='dash'||S.tab==='new'){ ch.innerHTML=''; ch.style.padding='6px 0'; return; }
  ch.style.padding='';
  var base=S.tab==='today'?todo:list;
  ch.innerHTML=['Tous','Études','Formations','Autres'].map(function(k){ var n=base.filter(function(p){return k==='Tous'||p.kind===k}).length;
    return '<button class="chip'+(S.kind===k?' on':'')+'" onclick="S.kind=\''+k+'\';render()">'+(ICON[k]?ICON[k]+' ':'')+k+'<i>'+n+'</i></button>'; }).join('');
}
function tab(t){ S.tab=t; ['today','all','new','dash'].forEach(function(x){document.getElementById('t-'+x).className=(x===t?'on':'')}); render(); if(t==='dash') loadDash(); window.scrollTo(0,0); }

function render(){
  var m=document.getElementById('main');
  if(!S.data){ header([],[]); m.innerHTML='<div class="empty"><div class="big">⏳</div>Chargement du suivi…</div>'; return; }
  var list=all().filter(function(p){ return p.doublon!=='Doublon'; }), todo=list.filter(isTodo);
  header(list,todo);
  if(S.tab==='dash'){ renderDash(); return; }
  if(S.tab==='new'){ renderNew(); return; }
  if(S.tab==='today'){
    var shown=todo.filter(function(p){return S.kind==='Tous'||p.kind===S.kind}).sort(sortTodo);
    m.innerHTML = shown.length ? '<div class="sect">'+shown.length+' action(s) à faire</div>'+shown.map(card).join('') : '<div class="empty"><div class="big">🎉</div><b>Tout est à jour !</b><br>Aucun message ni relance à faire pour le moment.</div>';
  } else {
    var q=S.q.toLowerCase(), et=[]; list.forEach(function(p){ if(p.etape && et.indexOf(p.etape)<0) et.push(p.etape) });
    var shown2=list.filter(function(p){ return (S.kind==='Tous'||p.kind===S.kind) && (!S.etape||p.etape===S.etape||(S.etape==='(vide)'&&!p.etape)) &&
      (!q || (p.nom+' '+p.wa+' '+p.details.map(function(d){return d[1]}).join(' ')).toLowerCase().indexOf(q)>=0); })
      .sort(function(a,b){ return (b.date||'').localeCompare(a.date||'') || b.row-a.row; });
    m.innerHTML='<input class="search" placeholder="🔍  Nom, numéro, destination…" value="'+esc(S.q)+'" oninput="S.q=this.value;renderKeep()">'+
      '<select class="sel" style="margin-bottom:12px" onchange="S.etape=this.value;render()"><option value="">Toutes les étapes</option><option value="(vide)"'+(S.etape==='(vide)'?' selected':'')+'>Sans étape</option>'+
      et.sort().map(function(e){return '<option'+(S.etape===e?' selected':'')+'>'+esc(e)+'</option>'}).join('')+'</select>'+
      '<div class="sect">'+shown2.length+' prospect(s)</div>'+shown2.slice(0,200).map(card).join('');
  }
}
function renderKeep(){ render(); var s=document.querySelector('.search'); if(s){ s.focus(); s.setSelectionRange(s.value.length,s.value.length);} }

function actClass(a){ return a==='Message à envoyer'?'a-msg':a==='RELANCER'?'a-rel':a==='RAPPEL RDV'?'a-rdv':a.indexOf('Passer')===0?'a-pas':'a-none'; }
function key(p){ return p.kind+'|'+p.row; }
function find(k){ var x=k.split('|'); return S.data.kinds[x[0]].filter(function(p){return p.row==x[1]})[0]; }
function waUrl(num,text){ return 'https://wa.me/'+encodeURIComponent(num)+(text?'?text='+encodeURIComponent(text):''); }
function canWrite(){ return S.data && S.data.ecriture; }

function card(p){
  var det=p.details.slice(0,3).map(function(d){return esc(d[1])}).join(' · ');
  var b=['<span class="bd">'+ICON[p.kind]+' '+p.kind+'</span>'];
  if(p.prio==='PRIORITÉ') b.push('<span class="bd red">🔥 PRIORITÉ</span>');
  if(p.etape) b.push('<span class="bd '+(['Dossier ouvert','Inscrit et payé','Terminé'].indexOf(p.etape)>=0?'ok':(p.etape==='Perdu'||p.etape==='En veille')?'grey':'')+'">'+esc(p.etape)+'</span>');
  if(p.last) b.push('<span class="bd or">Relance '+p.rel+'/'+p.maxRel+'</span>');
  if(p.rdv) b.push('<span class="bd vio">📅 '+fd(p.rdv)+(p.heure?' · '+p.heure.replace(':','h'):'')+'</span>');
  if(p.montant) b.push('<span class="bd ok">💰 '+fmtF(p.montant)+'</span>');
  var k=key(p), btns='';
  if(canWrite() && p.msg && (p.action==='Message à envoyer'||p.action==='RELANCER'||p.action==='RAPPEL RDV'))
    btns+='<a class="b wa" href="'+waUrl(p.num,p.msg)+'" target="_blank" rel="noopener" onclick="sent(\''+k+'\')">'+WA+(p.action==='RELANCER'?'Relancer':p.action==='RAPPEL RDV'?'Rappeler':'Envoyer')+'</a>';
  if(canWrite() && p.action.indexOf('Passer')===0) btns+='<button class="b or" onclick="openSheet(\''+k+'\',true)">'+(p.action==='Passer en veille'?'🌙 En veille':'✖ Perdu')+'</button>';
  if(canWrite() && p.last) btns+='<button class="b sec" onclick="replied(\''+k+'\')">↩︎ A répondu</button>';
  btns+='<button class="b ghost" onclick="openSheet(\''+k+'\')">Ouvrir</button>';
  return '<div class="card'+(p.prio==='PRIORITÉ'?' prio':'')+'"><div class="ctop"><div class="av '+AV[p.kind]+'">'+esc(initials(p.nom))+'</div><div class="cinfo"><div class="nm">'+esc(p.nom)+'</div><div class="meta">'+det+(p.date?' · fiche du '+fd(p.date):'')+'</div></div>'+
    (p.action&&p.action!=='—'?'<div class="act '+actClass(p.action)+'">'+esc(p.action)+'</div>':'')+'</div>'+
    '<div class="badges">'+b.join('')+'</div>'+
    (p.msg && S.tab==='today'?'<div class="prev">'+esc(p.msg)+'</div>':'')+
    '<div class="btns">'+btns+'</div></div>';
}

function replace(r){ var arr=S.data.kinds[r.kind]; for(var i=0;i<arr.length;i++) if(arr[i].row===r.row) arr[i]=r; }
function sent(k){
  var p=find(k), action=p.action;
  if(action==='RAPPEL RDV'){ toast('Rappel ouvert dans WhatsApp ✓'); return; }
  run('markSent',S.pin,p.kind,p.row,p.nom,action).then(function(res){ replace(res.row); render();
    toast((action==='RELANCER'?'Relance notée ✓ ':'Envoi noté ✓ ')+esc(p.nom.split(' ')[0]),'Annuler',function(){
      run('undoSent',S.pin,p.kind,p.row,p.nom,res.prev).then(function(r2){ replace(r2.row); render(); toast('Annulé'); }).catch(err); });
  }).catch(err);
}
function replied(k){ var p=find(k);
  run('markReplied',S.pin,p.kind,p.row,p.nom).then(function(res){ replace(res.row); render(); toast('Relances arrêtées ✓ Pense à changer l\'étape.','Ouvrir',function(){openSheet(k)}); }).catch(err); }

function openSheet(k,closing){
  var p=find(k), L=S.data.lists[p.kind], w=canWrite(), dis=w?'':' disabled';
  var opts=function(arr,v,blank){ return (blank?'<option value=""></option>':'')+arr.map(function(x){return '<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>'}).join(''); };
  var et = closing ? (p.action==='Passer en veille'?'En veille':'Perdu') : p.etape;
  var sendable = p.action==='Message à envoyer'||p.action==='RELANCER'||p.action==='RAPPEL RDV';
  var h='<div class="grab"></div>'+
    '<div class="box"><div class="ctop"><div class="av '+AV[p.kind]+'" style="width:52px;height:52px;font-size:17px">'+esc(initials(p.nom))+'</div><div class="cinfo"><div class="nm" style="font-size:18px">'+esc(p.nom)+'</div><div class="meta">'+ICON[p.kind]+' '+p.kind+(p.date?' · fiche du '+fd(p.date):'')+'</div></div>'+
    (p.action&&p.action!=='—'?'<div class="act '+actClass(p.action)+'">'+esc(p.action)+'</div>':'')+'</div>'+
    '<div class="btns"><a class="b wa" href="'+waUrl(p.num)+'" target="_blank">'+WA+'WhatsApp</a><a class="b sec" href="tel:+'+esc(p.num)+'">📞 Appeler</a></div></div>'+
    '<div class="box"><h3>📋 Informations</h3><div class="kv"><div>Numéro</div><div>'+esc(p.wa)+'</div>'+p.details.map(function(d){return '<div>'+esc(d[0])+'</div><div>'+esc(d[1])+'</div>'}).join('')+
    (p.last?'<div>Dernier message</div><div>'+fd(p.last)+' · relance '+p.rel+'/'+p.maxRel+'</div>':'')+(p.next?'<div>Prochaine relance</div><div>'+(p.next.indexOf('-')>0?fd(p.next):esc(p.next))+'</div>':'')+'</div></div>';
  if(w && p.msg) h+='<div class="box"><h3>💬 Message prévu</h3><div class="msgfull">'+esc(p.msg)+'</div>'+
    (sendable?'<div class="btns"><a class="b wa" href="'+waUrl(p.num,p.msg)+'" target="_blank" onclick="closeSheet();sent(\''+k+'\')">'+WA+'Envoyer ce message</a></div>':'')+'</div>';
  if(w) h+='<div class="box"><h3>✍️ Écrire un message</h3><textarea class="in" id="f-libre" placeholder="Bonjour '+esc(p.nom.split(' ')[0])+', …"></textarea>'+
    '<div class="btns"><button class="b wa" onclick="sendFree(\''+k+'\')">'+WA+'Envoyer sur WhatsApp</button></div><div class="hint">Le message s\'ouvre dans WhatsApp, prêt à partir, et une trace est gardée dans les notes.</div></div>';
  h+='<div class="box"><h3>🗂️ Suivi</h3>'+
    '<div class="fl">Étape</div><select class="sel" id="f-etape"'+dis+'>'+opts(L.etapes,et,true)+'</select>'+
    (p.hasRdv?'<div class="fl">'+(p.kind==='Études'?'Entretien':'Test')+' : date et heure</div><div class="two"><input class="in" type="date" id="f-rdv" value="'+esc(p.rdv)+'"'+dis+'>'+(p.hasHeure?'<input class="in" type="time" id="f-heure" value="'+esc(p.heure)+'"'+dis+'>':'<span></span>')+'</div>':'')+
    '<div class="fl">Montant encaissé (FCFA)</div><input class="in" type="number" inputmode="numeric" id="f-montant" value="'+esc(p.montant)+'"'+dis+'>'+
    '<div class="fl">Raison de la perte</div><select class="sel" id="f-raison"'+dis+'>'+opts(S.data.lists.raisons,p.raison,true)+'</select>'+
    (p.kind!=='Autres'?'<div class="fl">Responsable</div><select class="sel" id="f-resp"'+dis+'>'+opts(S.data.lists.resp,p.resp,true)+'</select>':'')+
    '<div class="fl">Notes</div><textarea class="in" id="f-notes"'+dis+'>'+esc(p.notes)+'</textarea>'+
    (w?'<div class="btns" style="margin-top:14px"><button class="b ghost" onclick="closeSheet()">Fermer</button><button class="b teal" id="saveBtn" onclick="save(\''+k+'\')">💾 Enregistrer</button></div><div class="hint">Changer l\'étape démarre automatiquement les messages de la nouvelle étape.</div>':'<div class="btns" style="margin-top:14px"><button class="b ghost" onclick="closeSheet()">Fermer</button></div>')+
    '</div>';
  var sh=document.getElementById('sheet'); sh.innerHTML=h; sh.scrollTop=0;
  document.getElementById('ov').className='ov open'; sh.className='sheet open';
}
function closeSheet(){ document.getElementById('ov').className='ov'; document.getElementById('sheet').className='sheet'; }
function val(id){ var e=document.getElementById(id); return e?e.value:undefined; }
function save(k){
  var p=find(k), f={etape:val('f-etape'),montant:val('f-montant'),raison:val('f-raison'),notes:val('f-notes')};
  if(p.hasRdv) f.rdv=val('f-rdv');
  if(p.hasHeure) f.heure=val('f-heure');
  if(p.kind!=='Autres') f.resp=val('f-resp');
  if(f.etape==='Perdu' && !f.raison){ toast('Choisis la raison de la perte avant d\'enregistrer.'); return; }
  document.getElementById('saveBtn').disabled=true;
  run('saveRow',S.pin,p.kind,p.row,p.nom,f).then(function(res){ replace(res.row); closeSheet(); render(); toast('Fiche enregistrée ✓'); }).catch(function(e){ var b=document.getElementById('saveBtn'); if(b) b.disabled=false; err(e); });
}
function sendFree(k){
  var p=find(k), t=val('f-libre'); if(!t||!t.trim()){ toast('Écris d\'abord ton message.'); return; }
  window.open(waUrl(p.num,t.trim()),'_blank');
  run('logMessage',S.pin,p.kind,p.row,p.nom,t.trim()).then(function(res){ replace(res.row); closeSheet(); render(); toast('Message ouvert dans WhatsApp ✓ (noté dans la fiche)'); }).catch(err);
}

function renderNew(){
  var F=S.data.fiches||{}, m=document.getElementById('main');
  var item=function(k,t,s){ var share='Bonjour 👋 Merci de remplir cette fiche (1 minute) pour que nous puissions vous accompagner : '+F[k];
    return '<div class="tile"><div class="av '+AV[k]+'">'+ICON[k]+'</div><div class="tt"><b>'+t+'</b><span>'+s+'</span>'+
      '<div class="mini"><a class="b teal" style="padding:10px" href="'+F[k]+'" target="_blank">Remplir ici</a><a class="b wa" style="padding:10px" href="https://wa.me/?text='+encodeURIComponent(share)+'" target="_blank">'+WA+'Envoyer le lien</a></div></div></div>'; };
  m.innerHTML='<div class="sect">Inscrire un nouveau prospect</div>'+
    item('Études','Études à l\'étranger','Bourses, Chine, Canada, Maroc…')+
    item('Formations','Formations en langues','Anglais, japonais')+
    item('Autres','Autres demandes','Traduction, visa, partenariat…')+
    '<div class="hint" style="margin:4px 6px">« Remplir ici » : tu remplis la fiche avec la personne (visite, appel, passage à l\'agence). « Envoyer le lien » : elle la remplit elle-même. Le prospect apparaît dans l\'appli 1 à 2 minutes après (bouton ⟳).</div>';
}

function loadDash(){ run('getDashboard',S.pin).then(function(d){ S.dash=d; if(S.tab==='dash') renderDash(); }).catch(err); }
function dd(v){ return /^\d{4}-\d{2}-\d{2}$/.test(v)?fd(v):v; }
function num(v){ return parseFloat(String(v).replace(/[\s  ]/g,'').replace(',','.'))||0; }
function renderDash(){
  var m=document.getElementById('main'), d=S.dash;
  if(!d){ m.innerHTML='<div class="empty"><div class="big">📊</div>Chargement des résultats…</div>'; return; }
  var L=d.left, h='<div class="sect">Période du '+esc(dd(d.period[0]))+' au '+esc(dd(d.period[1]))+'</div>';
  var tot=function(r){ return [1,2,3].reduce(function(s,c){return s+(parseInt(L[r][c])||0)},0); };
  h+='<div class="box"><h3>⚡ À faire aujourd\'hui</h3><div class="kpis"><div class="kpi"><b>'+tot(2)+'</b><span>messages</span></div><div class="kpi"><b>'+tot(3)+'</b><span>relances</span></div><div class="kpi"><b>'+tot(4)+'</b><span>rappels RDV</span></div></div>'+
     '<div class="drow"><div class="l"><span>🔥 Prospects PRIORITÉ en cours</span><span class="v" style="color:var(--red)">'+esc(L[6][1])+'</span></div></div></div>';
  var block=function(title,from,to){ var s='<div class="box"><h3>'+title+'</h3>';
    for(var r=from;r<=to;r++){ if(!L[r][0]) continue; var obj=L[r][2]&&L[r][2]!=='—'?L[r][2]:'', pct=obj&&num(obj)?Math.min(100,Math.round(num(L[r][1])/num(obj)*100)):-1;
      s+='<div class="drow"><div class="l"><span>'+esc(L[r][0])+'</span><span class="v">'+esc(L[r][1])+(obj?' <span class="o">/ '+esc(obj)+'</span>':'')+'</span></div>'+(pct>=0?'<div class="bar"><i style="width:'+pct+'%"></i></div>':'')+'</div>'; }
    return s+'</div>'; };
  h+=block('🎓 Études à l\'étranger',10,17)+block('🗣️ Formations en langues',21,27)+block('📄 Autres demandes',31,34)+block('🏫 Lycées',38,42);
  var R=d.right, s='<div class="box"><h3>📣 Par source</h3>';
  for(var i=2;i<R.length;i++){ if(!R[i][0]) continue; s+='<div class="drow"><div class="l"'+(R[i][0]==='Total'?' style="font-weight:800"':'')+'><span>'+esc(R[i][0])+'</span><span class="v">'+esc(R[i][1])+' fiche(s) <span class="o">· '+esc(R[i][2])+' F</span></span></div></div>'; }
  var T=S.data.ntfy, sub='https://ntfy.sh/'+T;
  var n='<div class="box"><h3>🔔 Notifications sur ce téléphone</h3><div class="hint" style="margin:0 0 10px;font-size:13px;color:var(--ink)">'+
    '1. Installe l\'appli gratuite <b>ntfy</b> (Play Store ou App Store).<br>2. Dans ntfy, touche <b>+</b> et entre ce nom :<br>'+
    '<div class="msgfull" style="margin:8px 0;font-weight:800;text-align:center;user-select:all">'+esc(T)+'</div>'+
    '3. Touche <b>Tester</b> ci-dessous : une notification doit arriver.</div>'+
    '<div class="btns"><button class="b sec" onclick="copyTopic()">📋 Copier le nom</button><button class="b or" onclick="testN()">🔔 Tester</button></div>'+
    '<div class="hint">Tu recevras : chaque nouvelle fiche, le programme du jour à 8h, un rappel à 16h s\'il reste des actions, et chaque RDV 1h avant.</div></div>';
  m.innerHTML=h+s+'</div>'+n;
}
function copyTopic(){ var t=S.data.ntfy; try{ navigator.clipboard.writeText(t).then(function(){toast('Nom copié ✓')},function(){toast(esc(t))}); }catch(e){ toast(esc(t)); } }
function testN(){ run('testNotif',S.pin).then(function(){ toast('Notification envoyée ✓ Regarde ton téléphone.'); }).catch(err); }

var tt=null;
function toast(msg,btn,fn){ var t=document.getElementById('toast'); document.getElementById('toastTxt').innerHTML=msg; var b=document.getElementById('toastBtn');
  b.textContent=btn||''; b.style.display=btn?'block':'none'; b.onclick=function(){ t.className='toast'; if(fn) fn(); };
  t.className='toast show'; clearTimeout(tt); tt=setTimeout(function(){t.className='toast'},btn?6000:3200); }

(function(){ var p=stored('ea_pin'); if(p){ S.pin=p; start(); } })();
</script>
</body>
</html>
